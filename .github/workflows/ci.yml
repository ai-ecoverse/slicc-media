name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
  statuses: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/pipeline.yml@v2.11.1
    secrets: inherit
    with:
      node-version: '24'
      test-glob: test/integration/*.test.mjs
      shards: 2
      review-prompt: |
        SLICC-MEDIA

        This repository is slicc-media (`@ai-ecoverse/slicc-media`): `media` and `mediaprobe`, ffmpeg-style commands shipped as one slicc-kernel `abi: "js"` module (`dist/media.mjs`, bundled with esbuild from `src/`). The README is the spec: read the sections the change touches first. `git diff origin/main...HEAD`, or `$RUNNER_TEMP/review/context/pr.diff`, is the change.

        Once this pull request passes the merge queue, semantic-release publishes it to npm from `main`. Review it as the last check before it ships.

        Look for real defects, in this order:
        1. Correctness against the README: options, stream selection, probing output, exit codes and error messages, and how a conversion behaves when the browser's WebCodecs lacks a codec.
        2. Codecs come only from WebCodecs through mediabunny: no codec code, no ffmpeg build, no mediabunny codec extension, and the commands are never named ffmpeg or ffprobe.
        3. Data loss: output files that are truncated, overwritten without asking, or left half-written on failure.
        4. Packaging: `files` ships everything `dist/media.mjs` loads, and the `slicc.commands` entries keep working on the slicc-kernel version `engines` names.
        5. Tests: every behaviour change has an integration test in `test/integration/`, and a fix's test fails without the fix.
        6. Repo rules: no comments anywhere, no unit tests in git, and a conventional-commit title (`fix`, `feat` and `perf` release, the rest don't).

        Run `npm run build` in a tree before you read or run its `dist/`. `test/integration/media.test.mjs` runs on the kernel's Node entry and needs no browser; `browser.test.mjs` runs in Chromium through the shared-web harness. Don't report style preferences, or anything you haven't confirmed in the code or by a run.

        Severity: deny for a confirmed P1 or P2: a crash, corrupt output, a regression in a common conversion or probe without a workaround, a behaviour change without its test, or a fix whose test passes without it. A narrow problem with a workaround is P3: comment with a repro and approve.
